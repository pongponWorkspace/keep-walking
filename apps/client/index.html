<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Locks the viewport to the device width and disables pinch-zoom on the
      page chrome (the map itself still pans/zooms). Required for the map to
      feel native on a phone (P1-F02-T09 acceptance: mobile viewport).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Placeholder tab title: no player ever sees this, so English is fine
      until narrative-designer publishes real copy keys.
    -->
    <title>Keep Walking - map/location spike</title>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <!--
        Sibling of #map, not a child: main.ts may replace #map's own content
        with an honest "not configured" fallback text (P1-F02-T09) when no
        tiles URL is set. The GPS status UI (P1-F02-T10) must survive that,
        since location works independently of whether the basemap rendered.
      -->
      <div id="hud"></div>
      <!--
        TL B-10 / P2-F04-T25: build profile + short SHA (docs/tech/F04-dungeon-presence.md section
        17: "playtest: ... แสดง version + short SHA"). main.ts fills this in only for a playtest
        build or once a real commit is set; empty otherwise, so a bare `pnpm dev` stays uncluttered.
      -->
      <div id="build-badge"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
