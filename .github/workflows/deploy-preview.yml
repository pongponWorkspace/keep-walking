# Owner: devops-engineer (P1-F02-T08). Publishes the Phase 1 preview: builds/unpacks map tiles
# (tools/tiles), publishes them to the Cloudflare Pages Free "map" project, builds the client
# against that tile set, and publishes it to the Cloudflare Pages Free "client" project
# (infra/config/pages.json). D-008 (Cloudflare Free, no card) · D-031 (tiles = XYZ + TileJSON).
#
# workflow_dispatch ONLY: this never runs on push/PR (CLAUDE.md "no production deploys by
# agents" -- a human always presses Run workflow, P1-F02-T19). It is a separate workflow from
# ci.yml on purpose: ci.yml never downloads large data (docs/tech/environments.md section 5),
# this one does (the Protomaps daily basemap extract, tools/tiles/bin/fetch-tools.sh/fetch-assets.sh).
#
# No `wrangler.toml`/`wrangler.jsonc` binding is used anywhere in this workflow: both Pages
# projects are static-only, deployed with `wrangler pages deploy` (docs/adr/0002-backend-stack.md
# section 3, "deploy ผ่าน wrangler จาก GitHub Actions ไม่ใช้ Git integration").
#
# Secrets read (GitHub Actions secrets only, never committed -- see
# infra/runbooks/preview-setup.md for how a HUMAN creates them in P1-F02-T17):
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
name: deploy-preview

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check budgets, skip every wrangler/Pages deploy call'
        type: boolean
        default: true
      use_github_pages_fallback:
        description: 'Allow the temporary GitHub Pages PMTiles fallback (tech note F02 7.3 step 3) when the Cloudflare Pages XYZ set is over budget. Off by default: GitHub Pages ToS forbids commercial use, spike-only.'
        type: boolean
        default: false

concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Fixed, non-secret: read again from infra/config/pages.json inside the job so this file stays
  # the single source of truth, but declared here so `env:` blocks below can see it too.
  #
  # NAME NOTE (P1-X40): this must NOT be called TILES_CONFIG. tools/tiles/bin/lib.sh already
  # reads an env var named TILES_CONFIG as an override for tools/tiles/config.json (see its
  # README.md "env TILES_CONFIG" row and tools/tiles/size-report.md). A job-level `env:` block
  # is visible to every step, including "Build tiles", so setting TILES_CONFIG here silently
  # redirected tools/tiles/bin/build.sh to read infra/config/pages.json instead of its own
  # config.json and it failed on the first missing key (.tools.pmtiles.version). infra/scripts
  # already use PAGES_CONFIG for exactly this file (infra/scripts/lib.sh) with no collision, so
  # this workflow uses the same name.
  PAGES_CONFIG: infra/config/pages.json

jobs:
  build-and-publish:
    name: build tiles + client, publish to Cloudflare Pages Free
    runs-on: ubuntu-latest
    environment: github-pages # only used when the GitHub Pages fallback steps actually run
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Read Pages project config (non-secret, infra/config/pages.json)
        id: pages_cfg
        run: |
          echo "map_url=$(jq -r .projects.map.url "$PAGES_CONFIG")" >> "$GITHUB_OUTPUT"
          echo "client_url=$(jq -r .projects.client.url "$PAGES_CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Build tiles (tools/tiles/bin/build.sh)
        id: tiles
        env:
          TILES_PUBLIC_BASE_URL: ${{ steps.pages_cfg.outputs.map_url }}
        run: |
          mkdir -p tools/tiles/out
          set +e
          # Full stdout+stderr also goes to tools/tiles/out/build.log (P1-X40) so the "Upload
          # tile build logs" step below can hand it to a human when there is no run-log access
          # (auth-less contributor, or the run log has expired). Everything build.sh itself
          # writes still reaches the live Actions log via tee.
          bash tools/tiles/bin/build.sh 2>&1 | tee tools/tiles/out/build.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "result=pages" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=ghpages" >> "$GITHUB_OUTPUT" ;;
            4) echo "result=nohost" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=fail" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Stop -- no free-tier host fits (HUMAN decision needed)
        if: steps.tiles.outputs.result == 'nohost'
        run: |
          echo "::error::tools/tiles/bin/build.sh exited 4: no free host fits this build (tech note F02-map-location-spike.md section 7.3 step 4). Do not switch to a paid host (D-001). Report BLOCKED/PARTIAL to HUMAN." >&2
          exit 1

      - name: Stop -- tile build failed (generic error, not a budget verdict)
        if: steps.tiles.outputs.result == 'fail'
        run: |
          echo "::error::tile build failed with exit ${{ steps.tiles.outputs.rc }} -- see the Build tiles step log for the cause (missing tool, download failure, or a bad input file). This is NOT the D-001 no-free-host-fits case (that is exit 4 only)." >&2
          exit 1

      - name: Stop -- only the GitHub Pages fallback fits and it was not requested
        if: steps.tiles.outputs.result == 'ghpages' && inputs.use_github_pages_fallback != true
        run: |
          echo "::error::Only the temporary GitHub Pages PMTiles fallback is within budget (tech note section 7.3 step 3). Re-run this workflow with 'use_github_pages_fallback: true' if that is expected, or shrink the tile build (lower area.maxzoom in tools/tiles/config.json) and re-run." >&2
          exit 1

      - name: Publish tiles to Cloudflare Pages (keep-walking-map)
        if: steps.tiles.outputs.result == 'pages'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: infra/scripts/publish-tiles.sh tools/tiles/out/publish

      - name: Stage GitHub Pages fallback (tiles, glyphs, sprites only)
        if: steps.tiles.outputs.result == 'ghpages' && inputs.use_github_pages_fallback == true
        run: infra/scripts/prepare-ghpages-fallback.sh tools/tiles/out/publish-ghpages

      - name: Upload GitHub Pages artifact
        if: steps.tiles.outputs.result == 'ghpages' && inputs.use_github_pages_fallback == true && inputs.dry_run != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/tiles/out/publish-ghpages

      - name: Deploy GitHub Pages fallback
        if: steps.tiles.outputs.result == 'ghpages' && inputs.use_github_pages_fallback == true && inputs.dry_run != true
        id: ghpages_deploy
        uses: actions/deploy-pages@v4

      - name: Resolve tile base URL for the client build
        id: tilebase
        if: steps.tiles.outputs.result == 'pages' || (steps.tiles.outputs.result == 'ghpages' && inputs.use_github_pages_fallback == true)
        run: |
          if [ "${{ steps.tiles.outputs.result }}" = "pages" ]; then
            echo "manifest=tools/tiles/out/publish/manifest.json" >> "$GITHUB_OUTPUT"
            echo "base_url=${{ steps.pages_cfg.outputs.map_url }}" >> "$GITHUB_OUTPUT"
          else
            # https://<owner>.github.io/<repo> -- deterministic from the repo's own name, same
            # value actions/deploy-pages would report (tech note section 9 URL pattern).
            echo "manifest=tools/tiles/out/publish-ghpages/manifest.json" >> "$GITHUB_OUTPUT"
            echo "base_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish client (keep-walking-preview)
        if: steps.tilebase.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: infra/scripts/publish-client.sh "${{ steps.tilebase.outputs.manifest }}" "${{ steps.tilebase.outputs.base_url }}"

      - name: Upload tile build logs
        # P1-X40: run logs are not always reachable (no auth, or the run has expired), so on
        # any failure in this job -- the tile build itself or a later "Stop" step -- the text
        # logs build.sh writes go into a small downloadable artifact. Never the tiles/pmtiles/
        # XYZ output (that is GBs and is exactly what the size budget steps above exist to
        # police); *.txt/*.json/build.log only.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tile-build-logs
          path: |
            tools/tiles/out/build.log
            tools/tiles/out/verify-bbox.txt
            tools/tiles/out/size-report.txt
            tools/tiles/out/size-report.json
            tools/tiles/out/publish/manifest.json
            tools/tiles/out/publish-over-budget/manifest.json
            tools/tiles/out/publish-ghpages/manifest.json
            tools/tiles/out/publish-ghpages-over-budget/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### deploy-preview result"
            echo "- dry_run: ${{ inputs.dry_run }}"
            echo "- tile result: ${{ steps.tiles.outputs.result }} (exit ${{ steps.tiles.outputs.rc }})"
            echo "- map project:    ${{ steps.pages_cfg.outputs.map_url }}"
            echo "- client project: ${{ steps.pages_cfg.outputs.client_url }}"
            echo "- tiles base URL used by the client build: ${{ steps.tilebase.outputs.base_url }}"
            echo ""
            echo "Run the curl checks in infra/runbooks/preview-setup.md against these URLs next."
          } >> "$GITHUB_STEP_SUMMARY"
